<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sheep It</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

  <!-- Apple iOS Web App / PWA Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sheep It">
  <!-- Safari tints its own status strip and bottom URL bar with this, so it
       has to be the colour at the screen's edges or it reads as a band laid
       over the page. The flock is what the app opens on, so this is the
       flock's background; syncThemeColor in app.js moves it to the surface
       colour once a chat, whose top and bottom are both chrome, is open. -->
  <meta name="theme-color" content="#090a0f">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <!-- iOS ignores manifest icons and SVG here: the home screen icon is this
       PNG, snapshotted once when the app is added. -->
  <link rel="apple-touch-icon" href="/icon-180.png">

  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Project and current-view controls share the header. -->
    <header class="app-header">
      <!-- The way back to the flock, which is the page this one opened from -->
      <button id="agent-select" class="agent-select" aria-label="Back to projects">
        <svg class="agent-select-chevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span id="agent-select-dot" class="agent-dot unknown"></span>
        <span id="agent-select-name" class="agent-select-name">Loading…</span>
      </button>
      <nav id="view-switcher" class="view-switcher hidden" aria-label="Pane view">
        <button type="button" id="btn-pane-chat" data-view="chat">Chat</button>
        <button type="button" id="btn-view-normal" data-view="normal">Normal</button>
        <button type="button" id="btn-console" data-view="console">Console</button>
      </nav>
      <button type="button" id="chat-btn-delete" class="icon-btn hidden" aria-label="Delete chat" title="Delete chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
      </button>
      <button type="button" id="btn-changes" class="icon-btn" aria-label="Changed files" title="Changed files">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2.5H6a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14.5 2.5 14.5 8 20 8"></polyline>
          <line x1="9" y1="12.5" x2="15" y2="12.5"></line>
          <line x1="12" y1="9.5" x2="12" y2="15.5"></line>
          <line x1="9" y1="18" x2="15" y2="18"></line>
        </svg>
        <span id="changes-count" class="changes-count hidden"></span>
      </button>

      <!-- The current worktree's tabs stay in the shared header across its
           transcript, chat, and Console views. -->
      <nav id="tab-strip" class="tab-strip hidden" aria-label="Tabs in this worktree"></nav>

    </header>

    <!-- Scrollable Transcript -->
    <!-- On a desktop, a Claude Code pane's chat, over the transcript -->
    <main id="history-container" class="history-container">
      <div id="history-content" class="history-content">
        <div class="history-empty">No active agent selected.</div>
      </div>
      <button id="btn-scroll-bottom" class="btn-scroll-bottom hidden" aria-label="Jump to bottom">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </button>
    </main>

    <section id="chat-chat-view" class="chat-view hidden">

      <div id="chat-messages" class="scroll messages"></div>
      <button id="chat-btn-scroll-bottom" class="btn-scroll-bottom hidden" aria-label="Jump to bottom">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </button>
      <!-- What the queue is holding for this pane, above the box it was typed in;
           held above the composer however far up the conversation you are -->
      <div class="chat-strips">
        <div id="chat-queue-strip" class="queue-strip hidden"></div>
        <div id="chat-attach-strip" class="attach-strip hidden"></div>
      </div>
    </section>

    <!-- Bottom Input Dock -->
    <footer class="input-dock">
      <div id="chat-slash-menu" class="slash-menu hidden" role="listbox"></div>
      <!-- What is waiting to go to this chat, above the box it was typed in -->
      <div id="chat-queue" class="chat-queue hidden"></div>

      <!-- Path suggestions for the @token being typed -->
      <div id="complete-bar" class="complete-bar hidden"></div>

      <!-- Keys the agent asks for at confirmation prompts -->
      <div id="keys-bar" class="keys-bar">
        <div class="keys-row">
          <button type="button" id="btn-esc" class="key-btn" title="Send Escape">esc</button>
          <button type="button" id="btn-ctrl-c" class="key-btn key-no" title="Send Interrupt (Ctrl+C) - tap twice">^C</button>
          <button type="button" class="key-btn key-yes" data-key="y">y</button>
          <button type="button" class="key-btn key-no" data-key="n">n</button>
          <button type="button" class="key-btn key-enter" data-key="enter">⏎</button>
        </div>
        <div class="keys-row">
          <!-- Number keys grow to match however many options the prompt lists -->
          <span id="keys-numbers" class="keys-numbers">
            <button type="button" class="key-btn" data-key="1">1</button>
            <button type="button" class="key-btn" data-key="2">2</button>
            <button type="button" class="key-btn" data-key="3">3</button>
          </span>
          <button type="button" class="key-btn" data-key="up">↑</button>
          <button type="button" class="key-btn" data-key="down">↓</button>
          <button type="button" class="key-btn" data-key="tab">⇥</button>
        </div>
      </div>

      <!-- Mirrors whatever is typed into the pane on the desktop -->
      <div id="terminal-input-row" class="terminal-input-row hidden">
        <div class="terminal-input-head">
          <span class="terminal-input-label">Already typed in the console</span>
          <button type="button" id="btn-adopt" class="terminal-input-act" title="Copy the console's text into the composer">Copy text</button>
          <button type="button" id="btn-unadopt" class="terminal-input-act danger" title="Delete the text from the console's input">Remove text</button>
        </div>
        <div id="terminal-input" class="terminal-input"></div>
      </div>

      <!-- Images on their way to the agent, drawn from the file the phone
           already has. The composer's text is what actually gets sent, so a
           thumbnail here is only shown while its path is still in it. -->
      <div id="attach-strip" class="attach-strip hidden"></div>

      <!-- A div, not a form: iPhone Safari hangs its ^ v Done bar over the
           keyboard for a field inside a <form>. The send button is wired by hand
           (SheepItComposer.bindSubmit). -->
      <div id="prompt-form" class="prompt-form composer">
        <textarea
          id="prompt-input"
          class="prompt-input"
          rows="1"
          placeholder="Prompt or tap mic…"
          enterkeyhint="enter"
          autocomplete="off"
          autocorrect="on"
          autocapitalize="none"
          spellcheck="true"
        ></textarea>
        <!-- Recall, attach and send: a row beside a one-line box, a column
             beside a grown one, where the taller box has made the room. -->
        <div class="prompt-actions">
          <!-- The arrow a terminal has: only offered when there is nothing in
               the box, and it brings back what was last sent here. -->
          <button type="button" id="btn-recall" class="btn-recall hidden" aria-label="Bring back the last prompt" title="Last prompt">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="6"></line>
              <polyline points="6 12 12 6 18 12"></polyline>
            </svg>
          </button>
          <button type="button" id="btn-attach" class="btn-attach" aria-label="Attach image" title="Attach image">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </button>
          <button type="button" id="btn-paste-image" class="btn-attach normal-only" aria-label="Paste photo from clipboard" title="Paste photo from clipboard">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6M8 15l2.5-2.5L13 15l1.5-1.5L17 16H8z"/><circle cx="15.5" cy="9" r="1"/></svg>
          </button>
          <button type="button" id="chat-btn-slash" class="btn-attach slash chat-only" aria-label="Skills and commands">/</button>
          <input type="file" id="chat-attach-input" multiple hidden>
          <button type="button" id="btn-keys" class="btn-attach btn-keys normal-only" aria-label="Keyboard keys" title="Keyboard keys" aria-pressed="false">⌨</button>
          <div id="composer-menu" class="composer-menu normal-only">
            <button type="button" id="btn-more" class="btn-attach btn-more" aria-label="More composer actions" title="More" aria-haspopup="menu" aria-expanded="false">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
            </button>
            <div id="composer-menu-panel" class="composer-menu-panel hidden" role="menu" aria-label="Composer actions">
              <button type="button" id="btn-cycle-mode" class="composer-menu-item" role="menuitem">Agent mode: <span id="mode-current">unknown</span></button>
              <button type="button" id="btn-copy" class="composer-menu-item" role="menuitem">Copy transcript</button>
            </div>
          </div>
          <!-- iOS turns this into Photo Library / Take Photo / Choose File.
               No `accept`: a video or a PDF is as welcome as a photo. -->
          <input type="file" id="attach-input" class="attach-input" multiple>
          <button type="button" id="btn-send" class="btn-send send" aria-label="Send prompt" disabled>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
          <button type="button" id="chat-btn-stop" class="send stop hidden normal-stop" aria-label="Stop agent" title="Stop agent"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg></button>
        </div>
      </div>
    </footer>
  </div>

  <!-- The flock: the page the app opens on, a chat is what you go into from
       here. On a wide window it stops being full-screen and becomes the
       column the chat sits beside. -->
  <section id="agent-picker" class="agent-picker" aria-label="Projects">
    <header class="picker-head">
      <!-- The panes by project, or the headless chats from + New -->
      <div id="flock-tabs" class="flock-tabs" role="group" aria-label="Show">
        <button type="button" data-flock-tab="projects" aria-pressed="true">Projects</button>
        <button type="button" data-flock-tab="chats" aria-pressed="false">Chats</button>
      </div>
      <!-- Where the windows above went: the same numbers, over days -->
      <button id="btn-usage" class="icon-btn" aria-label="Token usage" title="Token usage">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="20" x2="6" y2="13"></line>
          <line x1="12" y1="20" x2="12" y2="5"></line>
          <line x1="18" y1="20" x2="18" y2="9"></line>
        </svg>
      </button>
      <button id="btn-flock-settings" class="icon-btn" aria-label="Global Settings" title="Global Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button id="btn-new-workspace" class="picker-new" aria-label="New">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        New
      </button>
      <button id="btn-close-picker" class="icon-btn" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>
    <!-- The same usage windows the queue shows: what is left to spend on the
         herd, above the herd itself -->
    <div id="picker-quota" class="quota-strip"></div>
    <div id="agent-list" class="agent-list"></div>
  </section>

  <!-- The console: this pane's own terminal, not a reading of it -->
  <section id="console-view" class="full-view hidden" role="dialog" aria-label="Console">
    <div id="console-sub" class="console-status hidden" role="status" aria-live="polite"></div>
    <div id="console-term" class="console-term"></div>
    <!-- The keys a touch keyboard has no room for, and the ones a terminal
         needs most. Same key names as #keys-bar; KEY_VOCAB in app.js looks up
         the bytes these send instead of an RPC name. -->
    <div id="console-keys" class="console-keys">
      <button type="button" id="console-attach" class="key-btn console-attach-btn" aria-label="Attach photo or file" title="Attach photo or file"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21.4 11.1 12.2 20.3a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
      <button type="button" id="console-paste-photo" class="key-btn console-attach-btn" aria-label="Paste photo from clipboard" title="Paste photo from clipboard"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6M8 15l2.5-2.5L13 15l1.5-1.5L17 16H8z"/><circle cx="15.5" cy="9" r="1"/></svg></button>
      <button type="button" class="key-btn" data-key="esc">esc</button>
      <button type="button" class="key-btn" data-key="tab">tab</button>
      <button type="button" class="key-btn key-no" data-key="ctrl+c">^C</button>
      <button type="button" class="key-btn key-arrow" data-key="up" aria-label="Up arrow"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      <button type="button" class="key-btn key-arrow" data-key="down" aria-label="Down arrow"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14m6-6-6 6-6-6"/></svg></button>
      <button type="button" class="key-btn key-arrow" data-key="left" aria-label="Left arrow"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button>
      <button type="button" class="key-btn key-arrow" data-key="right" aria-label="Right arrow"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      <button type="button" class="key-btn key-enter" data-key="enter" aria-label="Enter"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 7v5h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <input type="file" id="console-attach-input" multiple hidden>
  </section>

  <!-- Changed files: what the agent actually did to the working tree -->
  <section id="changes-view" class="full-view hidden" role="dialog" aria-label="Changed files">
    <header class="view-head">
      <div class="view-head-text">
        <span class="view-title">Changes</span>
        <span id="changes-sub" class="view-sub"></span>
      </div>
      <button id="btn-diff-layout" class="view-action" aria-pressed="false" title="Side by side">Split</button>
      <button id="btn-close-changes" class="icon-btn" aria-label="Close changes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>
    <div id="changes-list" class="changes-list"></div>
  </section>

  <!-- Tokens: what the windows on the flock were spent on, over days rather
       than as a percentage of now -->
  <section id="usage-view" class="full-view hidden" role="dialog" aria-label="Token usage">
    <header class="view-head">
      <div class="view-head-text">
        <span class="view-title">Tokens</span>
        <span id="usage-sub" class="view-sub">reading the logs…</span>
      </div>
      <div id="usage-ranges" class="usage-ranges" role="group" aria-label="How far back">
        <button type="button" class="view-action" data-days="1">24h</button>
        <button type="button" class="view-action" data-days="7" aria-pressed="true">7d</button>
        <button type="button" class="view-action" data-days="30">30d</button>
      </div>
      <button id="btn-close-usage" class="icon-btn" aria-label="Close token usage">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>
    <div id="usage-body" class="usage-body"></div>
  </section>

  <!-- Global Settings: app-wide preferences and multiple heartbeats -->
  <section id="global-settings-view" class="full-view hidden" role="dialog" aria-label="Global Settings">
    <header class="view-head">
      <div class="view-head-text">
        <span class="view-title">Settings</span>
        <span class="view-sub">notifications and scheduled heartbeats</span>
      </div>
      <button id="btn-close-global-settings" class="icon-btn" aria-label="Close settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>
    <div id="global-settings-body" class="settings-body">
      <div class="settings-section">
        <div class="settings-section-head">
          <div class="settings-section-title">Notifications</div>
          <button type="button" id="btn-test-push" class="sheet-btn-small" disabled>Send test notification</button>
        </div>
        <div class="sheet-row">
          <label for="toggle-push">
            Notify when an agent needs you
            <span id="push-hint" class="sheet-hint"></span>
          </label>
          <input type="checkbox" id="toggle-push">
        </div>
        <div class="sheet-row">
          <label for="toggle-bleat">
            Bleat when an agent needs you
            <span class="sheet-hint">a finished turn or a question, while the app is open</span>
          </label>
          <input type="checkbox" id="toggle-bleat">
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-head">
          <div>
            <div class="settings-section-title">Chats</div>
            <div class="sheet-hint">the folder every chat from + New runs in</div>
          </div>
          <button type="button" id="btn-chat-home" class="sheet-btn-small">Change</button>
        </div>
        <div id="chat-home-path" class="chat-home-path"></div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">Overview</div>
        <div class="sheet-row">
          <label for="toggle-machine">
            Show machine load
            <span class="sheet-hint">cpu, ram, swap, disk and network of the machine the agents run on</span>
          </label>
          <input type="checkbox" id="toggle-machine">
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-head">
          <div>
            <div class="settings-section-title">Heartbeats</div>
            <div class="sheet-hint">Scheduled checks. Suppressed when HEARTBEAT_OK, alerts on anomaly.</div>
          </div>
          <button type="button" id="btn-add-heartbeat" class="sheet-btn-small">+ Add</button>
        </div>
        <div id="heartbeats-list" class="heartbeats-list"></div>
      </div>
    </div>
  </section>

  <!-- Settings sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>

  <!-- What every "+" asks. One sheet for all of them: at the top of the flock
       it asks chat, console or folder, on a project heading or the tab strip it asks
       worktree or tab, and the second step is whatever that answer needs. The
       body is drawn from JS because it is the question that changes. -->
  <section id="new-sheet" class="settings-sheet new-sheet hidden" role="dialog" aria-label="New">
    <div class="sheet-grip"></div>
